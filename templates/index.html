<!DOCTYPE html>
<html>
<head>
    <title>College Enquiry Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eef2ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbox {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Chat area */
        #chatbox {
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin: 14px 0;
            display: flex;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot .bubble {
            background: white;
            color: #222;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        /* Input area */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        #message {
            flex: 1;
            padding: 13px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        #message:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 22px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: scale(1.03);
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .chatbox {
                border-radius: 16px;
            }

            .header h1 {
                font-size: 21px;
            }

            #chatbox {
                height: 400px;
            }

            .bubble {
                max-width: 85%;
            }

            button {
                padding: 13px 17px;
            }
        }
    </style>
</head>

<body>

<div class="chatbox">

    <div class="header">
        <h1>🎓 College Enquiry Chatbot</h1>
        <p>Ask me anything about our college</p>
    </div>

    <div id="chatbox">

        <div class="message bot">
            <div class="bubble">
                <b>🤖 Bot:</b><br>
                Hello! 👋 How can I help you?
            </div>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your question..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button onclick="sendMessage()">Send</button>

    </div>

</div>

<script>

async function sendMessage() {

    let message = document.getElementById("message").value.trim();

    if (message === "") {
        return;
    }

    let chatbox = document.getElementById("chatbox");

    // User message
    chatbox.innerHTML +=
        "<div class='message user'>" +
        "<div class='bubble'><b>You:</b><br>" +
        message +
        "</div></div>";

    document.getElementById("message").value = "";

    chatbox.scrollTop = chatbox.scrollHeight;

    try {

        let response = await fetch("/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        let data = await response.json();

        // Bot response
        chatbox.innerHTML +=
            "<div class='message bot'>" +
            "<div class='bubble'><b>🤖 Bot:</b><br>" +
            data.reply +
            "</div></div>";

        chatbox.scrollTop = chatbox.scrollHeight;

    } catch (error) {

        chatbox.innerHTML +=
            "<div class='message bot'>" +
            "<div class='bubble'><b>🤖 Bot:</b><br>" +
            "Sorry, something went wrong. Please try again." +
            "</div></div>";
    }
}

</script>

</body>
</html>
